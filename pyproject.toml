[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
    "annotator/uniformer",
    "ldm/modules/midas",
    "assets",
    "models",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "F401", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
